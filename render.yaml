services:
  - type: web
    name: studia
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: LOG_IP_SALT
        generateValue: true
      - key: DEFAULT_TEACHER_PASSWORD
        sync: false
      - key: DEFAULT_DIRECTOR_PASSWORD
        sync: false
      - key: DEFAULT_DEV_PASSWORD
        sync: false
